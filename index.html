<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Цветик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ... (оставь свои стили, они хорошие) ... */
    :root { --primary: #0f5132; --bg: #fafafa; --card-shadow: 0 8px 24px rgba(0,0,0,0.04); --radius: 20px; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); padding-bottom: 40px; color: #1a1a1a; }
    .top-nav { padding: 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; background: var(--bg); }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .brand { font-size: 20px; font-weight: 700; }
    .brand span { display: block; font-size: 12px; color: #757575; font-weight: 400; }
    .banner { margin: 0 16px 24px; border-radius: var(--radius); overflow: hidden; position: relative; box-shadow: var(--card-shadow); }
    .banner img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; color: white; }
    .section-title { font-size: 18px; font-weight: 700; padding: 0 16px 12px; }
    .carousel-wrap { overflow-x: auto; padding: 0 16px 16px; display: flex; gap: 12px; scrollbar-width: none; }
    .carousel-card { flex: 0 0 160px; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--card-shadow); display: flex; flex-direction: column; }
    .img-wrapper { width: 100%; height: 140px; background: #f0f0f0; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .carousel-card .info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .carousel-card h4 { font-size: 14px; margin-bottom: 4px; }
    .carousel-card .price { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .catalog { display: flex; flex-direction: column; gap: 16px; padding: 0 16px; }
    .product { background: #fff; border-radius: var(--radius); padding: 12px; box-shadow: var(--card-shadow); display: flex; gap: 16px; align-items: center; }
    .product .img-wrapper { width: 90px; height: 90px; border-radius: 16px; flex-shrink: 0; overflow: hidden; }
    .product .info { flex: 1; min-width: 0; }
    .product h3 { font-size: 16px; margin-bottom: 4px; }
    .product .desc { font-size: 12px; color: #757575; margin-bottom: 8px; }
    .product .price { font-size: 16px; font-weight: 700; color: var(--primary); }
    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(15, 81, 50, 0.2); }
    #form { padding: 0 16px; display: none; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #757575; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 16px; border: 2px solid transparent; border-radius: 14px; font-size: 15px; background: #fff; box-shadow: var(--card-shadow); }
    input:focus { outline: none; border-color: var(--primary); }
    .btn-submit { background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; width: 100%; font-size: 16px; font-weight: 600; margin-top: 8px; }
    .btn-back { background: transparent; color: #757575; border: none; padding: 16px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top-nav"><div class="logo">🌸</div><div class="brand">Цветик<span>доставка с любовью</span></div></div>
  
  <div id="catalog">
    <div class="banner"><img src="https://images.unsplash.com/photo-1563241527-3004b7be0ffd?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80"><div class="banner-overlay"><h1>Свежие цветы</h1><p>Соберем и доставим за 2 часа</p></div></div>
    <h2 class="section-title">✨ Хиты продаж</h2><div class="carousel-wrap" id="carousel"></div>
    <h2 class="section-title">🌷 Весь каталог</h2><div class="catalog" id="list"></div>
  </div>

  <div id="form">
    <h2 class="section-title" style="padding-left:0; margin-bottom:16px;">Оформление</h2>
    <div id="selected-product" style="background:#fff; border-radius:20px; padding:16px; margin-bottom:24px; display:flex; gap:16px; align-items:center; box-shadow:var(--card-shadow);"></div>
    <div class="form-group"><label>Ваше имя *</label><input id="name" placeholder="Как к вам обращаться?" required></div>
    <div class="form-group"><label>Телефон *</label><input id="phone" type="tel" placeholder="+7 (999) 123-45-67" required></div>
    <div class="form-group"><label>Адрес доставки *</label><input id="address" placeholder="Улица, дом, квартира" required></div>
    <div style="display:flex; gap:12px;"><div class="form-group" style="flex:1;"><label>Дата *</label><input id="date" type="date" required></div><div class="form-group" style="flex:1;"><label>Время *</label><input id="time" type="time" required></div></div>
    <div class="form-group"><label>Текст открытки</label><textarea id="card" placeholder="Что написать?"></textarea></div>
    <button class="btn-submit" onclick="submitOrder()">Оформить заказ</button><button class="btn-back" onclick="goBack()">← Назад</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
    let selectedProduct = null;
    // ВСТАВЬ СЮДА ССЫЛКУ ОТ NGROK
    const BACKEND_URL = "https://your-ngrok-url.ngrok-free.app"; 

    // ЗАПРАШИВАЕМ ДАННЫЕ У БОТА (а не парсим CSV)
    fetch(`${BACKEND_URL}/api/products`)
      .then(res => res.json())
      .then(data => {
        const carousel = document.getElementById('carousel');
        const list = document.getElementById('list');

        // Функция для сброса кэша картинок
        const getImgUrl = (url) => {
            if (!url) return 'https://via.placeholder.com/150x150/e8f5e9/0f5132?text=🌸';
            return url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
        };

        data.slice(0, 4).forEach(p => {
          const card = document.createElement('div');
          card.className = 'carousel-card';
          card.innerHTML = `
            <div class="img-wrapper"><img src="${getImgUrl(p.photo)}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x150/e8f5e9/0f5132?text=🌸'"></div>
            <div class="info">
              <h4>${p.name}</h4>
              <div class="price">${p.price_num.toLocaleString()} ₽</div>
              <button class="btn" style="width:100%; padding:8px; margin-top:auto;" onclick='selectProduct(${JSON.stringify(p)})'>Выбрать</button>
            </div>`;
          carousel.appendChild(card);
        });

        data.forEach(p => {
          const item = document.createElement('div');
          item.className = 'product';
          item.innerHTML = `
            <div class="img-wrapper"><img src="${getImgUrl(p.photo)}" loading="lazy" onerror="this.src='https://via.placeholder.com/90x90/e8f5e9/0f5132?text=🌸'"></div>
            <div class="info">
              <h3>${p.name}</h3>
              <div class="desc">${p.composition || 'Красивый букет'}</div>
              <div class="price">${p.price_num.toLocaleString()} ₽</div>
            </div>
            <button class="btn" onclick='selectProduct(${JSON.stringify(p)})'>Выбрать</button>`;
          list.appendChild(item);
        });
      });

    function selectProduct(product) {
      selectedProduct = product;
      document.getElementById('selected-product').innerHTML = `
        <div class="img-wrapper" style="width:80px; height:80px;"><img src="${product.photo}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/80x80/e8f5e9/0f5132?text=🌸'"></div>
        <div>
          <div style="font-weight:700; font-size:16px; margin-bottom:4px;">${product.name}</div>
          <div style="font-size:13px; color:#757575; margin-bottom:8px;">${product.composition}</div>
          <div style="color:var(--primary); font-weight:700; font-size:18px;">${product.price_num.toLocaleString()} ₽</div>
        </div>`;
      document.getElementById('catalog').style.display = 'none';
      document.getElementById('form').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBack() { document.getElementById('catalog').style.display = 'block'; document.getElementById('form').style.display = 'none'; window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function submitOrder() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      if (!name || !phone || !address || !date || !time) { tg.showAlert('Заполните все поля *'); return; }

      const order = { product_id: selectedProduct.id, product_name: selectedProduct.name, price: selectedProduct.price_num, name, phone, address, date, time, card: document.getElementById('card').value.trim(), user_id: tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null };
      const btn = document.querySelector('.btn-submit'); btn.innerText = 'Отправляем...'; btn.disabled = true;

      fetch(`${BACKEND_URL}/api/order`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order) })
      .then(res => res.json())
      .then(data => {
        if (data.success) { tg.showAlert('🎉 Заказ оформлен!'); tg.close(); }
        else { tg.showAlert('Ошибка: ' + data.error); btn.innerText = 'Оформить заказ'; btn.disabled = false; }
      })
      .catch(() => { tg.showAlert('Ошибка сети.'); btn.innerText = 'Оформить заказ'; btn.disabled = false; });
    }
  </script>
</body>
</html>
