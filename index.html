<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отладка CSV</title>
  <style>
    body { font-family: monospace; padding: 16px; background: #1e1e1e; color: #00ff00; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    h3 { color: #fff; margin-top: 20px; margin-bottom: 8px; }
    .row { background: #333; padding: 8px; margin-bottom: 8px; border-left: 4px solid #e91e63; }
    .col { color: #4CAF50; }
  </style>
</head>
<body>
  <h3>1. Сырой ответ от Google (CSV):</h3>
  <div id="raw-text">Загрузка...</div>

  <h3>2. Как это разбил наш парсер:</h3>
  <div id="parsed-rows"></div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/12NFsicWYaYWPCbZpMYIsb7B8m9q_yb9_236hUJClTrE/export?format=csv";

    fetch(SHEET_CSV_URL)
      .then(res => res.text())
      .then(csvText => {
        // 1. Показываем сырой текст
        document.getElementById('raw-text').innerText = csvText;

        // 2. Парсим и показываем результат
        const rows = parseCustomCSV(csvText);
        const parsedDiv = document.getElementById('parsed-rows');
        
        // Берем первые 4 строки для примера
        rows.slice(0, 4).forEach((row, i) => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'row';
          rowDiv.innerHTML = `<b>Строка ${i + 1}:</b><br>` + 
            row.map((cell, j) => `<span class="col">[${j}]:</span> "${cell}"`).join(' | ');
          parsedDiv.appendChild(rowDiv);
        });
      });

    function parseCustomCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === ',') {
          if (!nextChar || nextChar === '\n' || nextChar === '\r') {
             currentRow.push(currentCell.trim());
             currentCell = '';
          } 
          else if (nextChar === ' ') {
             currentCell += char; 
          } 
          else {
             currentRow.push(currentCell.trim());
             currentCell = '';
          }
        } 
        else if (char === '\n' || char === '\r') {
          if (currentCell || currentRow.length > 0) {
            currentRow.push(currentCell.trim());
            rows.push(currentRow);
            currentRow = [];
            currentCell = '';
          }
        } 
        else {
          currentCell += char;
        }
      }
      if (currentCell || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        rows.push(currentRow);
      }
      return rows;
    }
  </script>
</body>
</html>
